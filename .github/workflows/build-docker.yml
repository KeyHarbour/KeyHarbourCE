
name: Deploy to QA

on:
  push:
    branches:
      - qa

env:
  KAMAL_VERSION: ${{ vars.KAMAL_VERSION }}
  KAMAL_REGISTRY_USERNAME: ${{ github.actor || 'keyharbour' }}
  KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}    
  RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
  POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
  POSTGRES_DB: ${{ vars.POSTGRES_DB }}
  POSTGRES_PORT: ${{ vars.POSTGRES_PORT }}
  GITHUB_ACTOR: ${{ github.actor }}
  POSTGRES_USER: ${{ vars.POSTGRES_USER }}
  ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ${{ secrets.ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY }}
  ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ${{ secrets.ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY }}
  ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ${{ secrets.ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT }}
  HOST: ${{ vars.HOST }}   
  MEILISEARCH_HOST: ${{ vars.MEILISEARCH_HOST }}
  MEILI_MASTER_KEY: ${{ secrets.MEILI_MASTER_KEY }}
  DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
  SERVER_IP: ${{ vars.SERVER_IP }}

jobs:
  increment_version:
    name: Increment Version
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.step_version.outputs.version }}
    permissions:
      contents: write
    steps:
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.MY_KH_APP }}
          private-key: ${{ secrets.MY_KH_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ steps.generate-token.outputs.token }}
          persist-credentials: true 
          fetch-depth: 0

      - name: Auto-increment Version and Tag
        id: step_version
        run: |
          bin/release.rb
          VERSION=$(cat VERSION | tr -d '[:space:]')
            
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          CHANGE_DATE=$(date -d "+4 years" +"%Y-%m-%d")
          cp docs/LICENSE LICENSE
          sed -i "s/{{VERSION}}/$VERSION/g" LICENSE
          sed -i "s/{{CHANGE_DATE}}/$CHANGE_DATE/g" LICENSE
          git add VERSION
          git add CHANGELOG.md
          git add LICENSE
          
          git commit -m "skip: bump version to $VERSION [skip ci]"
          
          git push origin qa
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          gh release create "v${VERSION}" \
            --generate-notes \
            --title "Release v${VERSION}"

  build-and-push:
    runs-on: ubuntu-26.04
    environment: docker
    needs: [increment_version]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: v${{ needs.increment_version.outputs.version }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Connect to dockerhub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and release image on docker
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            keyharbour/keyharbouree:latest
            keyharbour/keyharbouree:${{ needs.increment_version.outputs.version }}          