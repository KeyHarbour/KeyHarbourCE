
name: Deploy to QA

on:
  push:
    branches:
      - qa

env: 
  POSTGRES_DB: keyharbour_ce_test
  GITHUB_ACTOR: ${{ github.actor }}
  POSTGRES_USER: keyharbour_ce
  HOST: localhost 

jobs:
  increment_version:
    name: Increment Version
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.step_version.outputs.version }}
    permissions:
      contents: write
    steps:
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.MY_KH_APP }}
          private-key: ${{ secrets.MY_KH_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ steps.generate-token.outputs.token }}
          persist-credentials: true 
          fetch-depth: 0

      - name: Auto-increment Version and Tag
        id: step_version
        run: |
          bin/release.rb
          VERSION=$(cat VERSION | tr -d '[:space:]')
            
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          CHANGE_DATE=$(date -d "+4 years" +"%Y-%m-%d")
          cp docs/LICENSE LICENSE
          sed -i "s/{{VERSION}}/$VERSION/g" LICENSE
          sed -i "s/{{CHANGE_DATE}}/$CHANGE_DATE/g" LICENSE
          git add VERSION
          git add CHANGELOG.md
          git add LICENSE
          
          git commit -m "skip: bump version to $VERSION [skip ci]"
          
          git push origin qa
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          gh release create "v${VERSION}" \
            --generate-notes \
            --title "Release v${VERSION}"

  build-and-push:
    runs-on: ubuntu-26.04
    environment: docker
    needs: [increment_version]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: v${{ needs.increment_version.outputs.version }}

      - name: Generate random test secrets
        run: |
          echo "ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY=$(openssl rand -hex 16)" >> $GITHUB_ENV
          echo "ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY=$(openssl rand -hex 16)" >> $GITHUB_ENV
          echo "ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT=$(openssl rand -hex 16)" >> $GITHUB_ENV
          echo "MEILI_MASTER_KEY=$(openssl rand -hex 16)" >> $GITHUB_ENV
          echo "SECRET_KEY_BASE=$(openssl rand -hex 64)" >> $GITHUB_ENV
          echo "RAILS_MASTER_KEY=$(openssl rand -hex 64)" >> $GITHUB_ENV
          echo "POSTGRES_PASSWORD=$(openssl rand -hex 64)" >> $GITHUB_ENV


      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Connect to dockerhub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and release image on docker
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            keyharbour/keyharbource:latest
            keyharbour/keyharbource:${{ needs.increment_version.outputs.version }}          