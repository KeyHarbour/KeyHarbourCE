name: CI

on:
  pull_request:
    branches: [ "main" ]

env:
  POSTGRES_DB: keyharbour_ce_test
  RAILS_ENV: test
  DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432

jobs:

  scan_ruby:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Generate random test secrets
        run: |
          echo "ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY=$(openssl rand -hex 16)" >> $GITHUB_ENV
          echo "ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY=$(openssl rand -hex 16)" >> $GITHUB_ENV
          echo "ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT=$(openssl rand -hex 16)" >> $GITHUB_ENV
          echo "MEILI_MASTER_KEY=$(openssl rand -hex 16)" >> $GITHUB_ENV
          echo "SECRET_KEY_BASE=$(openssl rand -hex 64)" >> $GITHUB_ENV

      - name: Install Ruby and gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.6'
          bundler-cache: true

      - name: Configure Bundler
        run: bundle config set --local frozen false

      - name: Install dependencies
        run: bundle install --jobs 4 --retry 3

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager -x PermitAttributes
      
      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit

  scan_js:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Generate random test secrets
        run: |
          echo "ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY=$(openssl rand -hex 16)" >> $GITHUB_ENV
          echo "ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY=$(openssl rand -hex 16)" >> $GITHUB_ENV
          echo "ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT=$(openssl rand -hex 16)" >> $GITHUB_ENV
          echo "MEILI_MASTER_KEY=$(openssl rand -hex 16)" >> $GITHUB_ENV
          echo "SECRET_KEY_BASE=$(openssl rand -hex 64)" >> $GITHUB_ENV

      - name: Install Ruby and gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.6'
          bundler-cache: true

      - name: Cache APT packages
        uses: actions/cache@v6
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-vips
          restore-keys: |
            ${{ runner.os }}-apt-          

      - name: Install libvips
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvips-dev          

      - name: Configure Bundler
        run: bundle config set --local frozen false

      - name: Install dependencies
        run: bundle install --jobs 4 --retry 3

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint:
    runs-on: ubuntu-26.04
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Generate random test secrets
        run: |
          echo "ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY=$(openssl rand -hex 16)" >> $GITHUB_ENV
          echo "ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY=$(openssl rand -hex 16)" >> $GITHUB_ENV
          echo "ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT=$(openssl rand -hex 16)" >> $GITHUB_ENV
          echo "MEILI_MASTER_KEY=$(openssl rand -hex 16)" >> $GITHUB_ENV
          echo "SECRET_KEY_BASE=$(openssl rand -hex 64)" >> $GITHUB_ENV

      - name: Install Ruby and gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.6'
          bundler-cache: true

      - name: Configure Bundler
        run: bundle config set --local frozen false

      - name: Install dependencies
        run: bundle install --jobs 4 --retry 3

      - name: Prepare RuboCop cache
        uses: actions/cache@v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  tests:
    runs-on: ubuntu-26.04
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3
      meilisearch:
        image: getmeili/meilisearch:v1.54
        env:
          MEILI_MASTER_KEY: password123
          MEILI_ENV: development
          MEILI_NO_ANALYTICS: "true"
        ports:
          - 7700:7700
        options: >-
          --health-cmd="curl -f http://localhost:7700/health"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    steps:
      - name: Cache APT packages
        uses: actions/cache@v6
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-vips
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Generate random test secrets
        run: |
          echo "ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY=$(openssl rand -hex 16)" >> $GITHUB_ENV
          echo "ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY=$(openssl rand -hex 16)" >> $GITHUB_ENV
          echo "ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT=$(openssl rand -hex 16)" >> $GITHUB_ENV
          echo "MEILI_MASTER_KEY=$(openssl rand -hex 16)" >> $GITHUB_ENV
          echo "SECRET_KEY_BASE=$(openssl rand -hex 64)" >> $GITHUB_ENV

      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev libvips-dev

      - name: Checkout code
        uses: actions/checkout@v7
        
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - name: Install Ruby and gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.6'
          bundler-cache: true
          
      - name: Install libvips
        run: |
          sudo apt-get update
          sudo apt-get install -y libvips-dev  

      - name: Configure Bundler
        run: bundle config set --local frozen false

      - name: Install dependencies
        run: bundle install --jobs 4 --retry 3

      - name: Run tests
        run: |
          bin/rails db:setup RAILS_ENV=test
          bundle exec rspec spec

      - name: Generate coverage badge
        run: bin/coverage_badge         


      - name: Upload coverage badge
        uses: actions/upload-artifact@v7
        with:
          name: coverage-badge
          path: coverage.svg          

  coverage:
    name: Add Coverage Badge
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    needs: [tests, scan_js, scan_ruby, lint]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }} 

      - name: Download coverage badge
        uses: actions/download-artifact@v8
        with:
          name: coverage-badge
          path: .

      - name: Generate random test secrets
        run: |
          echo "ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY=$(openssl rand -hex 16)" >> $GITHUB_ENV
          echo "ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY=$(openssl rand -hex 16)" >> $GITHUB_ENV
          echo "ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT=$(openssl rand -hex 16)" >> $GITHUB_ENV
          echo "MEILI_MASTER_KEY=$(openssl rand -hex 16)" >> $GITHUB_ENV
          echo "SECRET_KEY_BASE=$(openssl rand -hex 64)" >> $GITHUB_ENV
          
      - name: Add coverage
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add coverage.svg
          if git diff-index --quiet HEAD -- coverage.svg; then
            echo "Le badge n'a pas changé. Aucun push nécessaire."
          else
            git commit -m "chore: Adding coverage [skip ci]"
            git push origin HEAD:${{ github.head_ref }}
          fi

  swagger:
    name: Add Swagger
    runs-on: ubuntu-26.04
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3
      meilisearch:
        image: getmeili/meilisearch:v1.12
        env:
          MEILI_MASTER_KEY: password123
          MEILI_ENV: development
          MEILI_NO_ANALYTICS: "true"
        ports:
          - 7700:7700
        options: >-
          --health-cmd="curl -f http://localhost:7700/health"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    permissions:
      contents: write
    needs: [coverage]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }} 

      - name: Cache APT packages
        uses: actions/cache@v6
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-vips
          restore-keys: |
            ${{ runner.os }}-apt-          

      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev libvips-dev

      - name: Install Ruby and gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.6'
          bundler-cache: true

      - name: Prepare tests
        run: |
          bundle exec rails db:setup RAILS_ENV=test
          
      - name: Add swagger
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          bundle exec rake rswag:specs:swaggerize
          git add swagger/v2/openapi.yaml
          if git diff-index --quiet HEAD -- coverage.svg; then
            echo "No new content for swagger"
          else
            git commit -m "chore: Adding swagger [skip ci]"
            git push origin HEAD:${{ github.head_ref }}
          fi         