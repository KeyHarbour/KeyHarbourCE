apiVersion: v1
kind: Secret
metadata:
  name: keyharbour-secrets
type: Opaque
stringData:
  # Valeurs par défaut pour le développement local (Kind / Minikube)
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "your_secure_password_here"
  MEILI_MASTER_KEY: "your_meilisearch_master_key_here"
  SECRET_KEY_BASE: "local_rails_secret_key_base_only_for_dev_purposes_12345"
  ENV: "Production"
  MEILI_ENV: "Production"
  
  # use bin/rails db:encryption:init to generate the following key
  RAILS_MASTER_KEY: "votre_master_key_de_developpement_ici"
  ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: "collez_ici_la_primary_key_generee"
  ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: "collez_ici_la_deterministic_key_generee"
  ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: "collez_ici_le_salt_genere"
  MAILER_USERNAME: "MAILER_USERNAME"
  MAILER_PASSWORD: "MAILER_PASSWORD"
  MAILER_PORT: "MAILER_PORT"
  MAILER_ADDRESS: "MAILER_ADDRESS"
  HOST: "localhost"