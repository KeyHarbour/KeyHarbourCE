default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  primary:
    <<: *default
    database: <%= ENV.fetch("POSTGRES_DB", "key_harbour_ce") %>_development
    migrations_paths: <%= Gem.loaded_specs['key_harbour_core'].full_gem_path %>/db/migrate
  logs:
    <<: *default
    database: <%= ENV.fetch("POSTGRES_DB", "key_harbour_ce") %>_logs_development
    migrations_paths: <%= Gem.loaded_specs['key_harbour_core'].full_gem_path %>/db/logs_migrate
  queue:
    <<: *default
    database: <%= ENV.fetch("POSTGRES_DB", "key_harbour_ce") %>_queue_development
    migrations_paths: db/queue_migrate

test:
  primary:
    <<: *default
    url: <%= ENV['DATABASE_URL'] %>
    database: <%= ENV.fetch("POSTGRES_DB", "key_harbour_ce") %>_test
    migrations_paths: <%= Gem.loaded_specs['key_harbour_core'].full_gem_path %>/db/migrate
  logs:
    <<: *default
    url: <%= ENV['DATABASE_URL'] %>
    database: <%= ENV.fetch("POSTGRES_DB", "key_harbour_ce") %>_logs_test
    migrations_paths: <%= Gem.loaded_specs['key_harbour_core'].full_gem_path %>/db/logs_migrate
  queue:
    <<: *default
    url: <%= ENV['DATABASE_URL'] %>
    database: <%= ENV.fetch("POSTGRES_DB", "key_harbour_ce") %>_queue_test
    migrations_paths: db/queue_migrate

production:
  primary:
    <<: *default
    database: <%= ENV.fetch("POSTGRES_DB", "key_harbour_ce") %>_production
    username: <%= ENV.fetch("POSTGRES_USER", "keyharbour") %>
    password: <%= ENV["POSTGRES_PASSWORD"] %>
    host: <%= ENV.fetch("DB_HOST", "key_harbour_ce-db") %>
    port: <%= ENV.fetch("POSTGRES_PORT", 5432) %>
    migrations_paths: <%= Gem.loaded_specs['key_harbour_core'].full_gem_path %>/db/migrate
  cache:
    <<: *default
    database: <%= ENV.fetch("POSTGRES_DB", "key_harbour_ce") %>_cache_production
    username: <%= ENV.fetch("POSTGRES_USER", "keyharbour") %>
    password: <%= ENV["POSTGRES_PASSWORD"] %>
    host: <%= ENV.fetch("DB_HOST", "key_harbour_ce-db") %>
    port: <%= ENV.fetch("POSTGRES_PORT", 5432) %>
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: <%= ENV.fetch("POSTGRES_DB", "key_harbour_ce") %>_queue_production
    username: <%= ENV.fetch("POSTGRES_USER", "keyharbour") %>
    password: <%= ENV["POSTGRES_PASSWORD"] %>
    host: <%= ENV.fetch("DB_HOST", "key_harbour_ce-db") %>
    port: <%= ENV.fetch("POSTGRES_PORT", 5432) %>
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: <%= ENV.fetch("POSTGRES_DB", "key_harbour_ce") %>_cable
    username: <%= ENV.fetch("POSTGRES_USER", "keyharbour") %>
    password: <%= ENV["POSTGRES_PASSWORD"] %>
    host: <%= ENV.fetch("DB_HOST", "key_harbour_ce-db") %>
    port: <%= ENV.fetch("POSTGRES_PORT", 5432) %>
    migrations_paths: db/cable_migrate
  logs:
    <<: *default
    database: <%= ENV.fetch("POSTGRES_DB", "key_harbour_ce") %>_logs_production
    username: <%= ENV.fetch("POSTGRES_USER", "keyharbour") %>
    password: <%= ENV["POSTGRES_PASSWORD"] %>
    host: <%= ENV.fetch("DB_HOST", "key_harbour_ce-db") %>
    port: <%= ENV.fetch("POSTGRES_PORT", 5432) %>
    migrations_paths: <%= Gem.loaded_specs['key_harbour_core'].full_gem_path %>/db/logs_migrate